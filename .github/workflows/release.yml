name: Release

# Triggered by pushing a tag of the form v1.2.3.
# Workflow: install deps -> build (webpack) -> publish to npm via Trusted
# Publishing (OIDC, no token) -> create GitHub Release.
# Build happens in the runner, never on your local machine.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for creating the GitHub Release
      id-token: write   # for npm OIDC Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Fail early if the tag doesn't match package.json version.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      # Trusted Publishing requires npm CLI >= 11.5.1 — the Node 20 default is 10.x.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build

      # No NODE_AUTH_TOKEN — npm CLI does an OIDC exchange with the
      # registry, which validates this workflow against the Trusted
      # Publisher configured on npmjs.com for `tabby-agent-chat`.
      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/index.js
