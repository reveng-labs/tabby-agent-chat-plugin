name: Release

# Triggered by pushing a tag of the form v1.2.3.
# Workflow: install deps -> build (webpack) -> publish to npm via Trusted
# Publishing (OIDC, no token) -> create GitHub Release.
# Build happens in the runner, never on your local machine.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for creating the GitHub Release
      id-token: write   # for npm OIDC Trusted Publishing (used once TP is configured)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing requires npm >= 11.5.1; Node 20 ships with 10.x.
      - run: npm install -g npm@latest

      # Fail early if the tag doesn't match package.json version.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      # Publish via npm Trusted Publishing — the id-token: write permission
      # at the job level lets npm verify the OIDC claim from this workflow
      # against the trusted publisher configured on the package's npm page.
      # No NPM_TOKEN needed.
      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/index.js
